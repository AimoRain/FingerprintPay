name: Build Debug APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码，关键是 submodules: recursive，否则依赖库下载不全
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. 配置 Java 环境 (Java 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. 给编译脚本执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 关键步骤：只编译 Debug 版本，不需要密钥
      # -Pxposed=true 是保留原作者的参数，确保 Xposed 资源正确生成
      - name: Build with Gradle
        run: ./gradlew clean :app:assembleDebug -Pxposed=true

      # 5. 上传编译好的 APK 给你下载
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FingerprintPay-Debug
          path: app/build/outputs/apk/debug/*.apk
